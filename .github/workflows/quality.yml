name: Quality and Evidence Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run syntax and evidence tests
        run: npm run check
      - name: Regenerate evidence matrix
        run: npm run build:evidence
      - name: Verify generated evidence files are current
        run: git diff --exit-code -- evidence-matrix.json EVIDENCE_MATRIX.csv EVIDENCE_MATRIX.md
      - name: Run synthetic benchmark
        run: npm run benchmark
